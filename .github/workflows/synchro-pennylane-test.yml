# Synchronisation Pennylane (lots 18, 18b et 19, décisions 0011, 0012 et 0013).
# Lot 19 : une demande de type « test » teste seulement les jetons enregistrés dans le logiciel (GET /me, identité
# de la société et droits), sans lire de comptabilité ni rien publier.
# Lancée depuis la page Import comptable (fonction serveur Supabase « lancer-synchro », qui transmet le
# numéro de la demande), ou à la main : onglet Actions, « Synchro Pennylane », « Run workflow ».
# Lecture seule (secret PENNYLANE_TOKEN_PILOTE), calcul par le moteur, publication dans la base de test
# avec la démonstration (secret SUPABASE_SECRET_KEY). Journaux : nombres et contrôles, aucun montant.
name: Synchro Pennylane
run-name: ${{ inputs.demande && format('Synchro Pennylane - demande {0}', inputs.demande) || 'Synchro Pennylane - lancement manuel' }}

on:
  workflow_dispatch:
    inputs:
      demande:
        description: "Numéro de la demande (renseigné par la page ; laisser vide en lancement manuel)"
        required: false
        default: ""
      mode:
        description: "Lancement manuel : écritures reprises (sinon le réglage de la page)"
        type: choice
        options:
          - reglage-de-la-page
          - valides
          - tous
        default: reglage-de-la-page

permissions:
  contents: read

concurrency:
  group: publication-supabase
  cancel-in-progress: false

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Lire Pennylane, calculer et publier
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PENNYLANE_TOKEN_PILOTE: ${{ secrets.PENNYLANE_TOKEN_PILOTE }}
          # Lot 19 (décision 0013) : clé privée qui déchiffre les jetons enregistrés dans le logiciel
          PENNYLANE_CLE_PRIVEE: ${{ secrets.PENNYLANE_CLE_PRIVEE }}
          PENNYLANE_MODE: ${{ inputs.mode != 'reglage-de-la-page' && inputs.mode || '' }}
          DEMANDE: ${{ inputs.demande }}
        run: |
          if [ -n "$DEMANDE" ]; then
            python interface/publier_supabase.py --demande "$DEMANDE"
          else
            python interface/publier_supabase.py --pennylane
          fi
