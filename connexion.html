<!doctype html>
<html lang="fr">
<head>
<title>Connexion – Pilotage Zenitude</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app/config.js"></script>
<script src="app/zenitude.js"></script>
</head>
<body>
<div class="connexion">
  <aside class="marque">
    <div>
      <img src="interface/logo_zenitude.png" alt="Zenitude" onerror="this.remove()">
      <div class="titre">Pilotage des résidences</div>
      <p class="sous-titre">Contrôle de gestion du groupe : comptes, indicateurs et résidences de votre parc.</p>
    </div>
    <p class="test">Phase de test : toutes les données affichées sont fictives.</p>
  </aside>
  <div class="formulaire-zone">
    <form class="formulaire" id="form" novalidate>
      <h1>Connexion</h1>
      <p class="doux">Utilisez votre adresse @zenitude-groupe.com.</p>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required>
      <button type="submit" id="valider">Se connecter</button>
      <div class="message" id="msg" role="alert"></div>
    </form>
  </div>
</div>
<script>
(async function () {
  if (!Zen.pret) return;
  if (await Zen.session()) { location.replace("espace.html"); return; }
  var form = document.getElementById("form"), msg = document.getElementById("msg"), btn = document.getElementById("valider");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim().toLowerCase();
    var mdp = document.getElementById("mdp").value;
    if (!email || !mdp) { Zen.message(msg, "Renseignez l’adresse et le mot de passe."); return; }
    btn.disabled = true; btn.textContent = "Connexion…"; Zen.message(msg, "");
    var r = await Zen.client.auth.signInWithPassword({ email: email, password: mdp });
    if (r.error) {
      Zen.message(msg, Zen.traduire(r.error));
      btn.disabled = false; btn.textContent = "Se connecter";
      return;
    }
    location.replace("espace.html");
  });
})();
</script>
</body>
</html>
